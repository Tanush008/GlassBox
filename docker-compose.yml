version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# The frontend is not containerized here on purpose: Next.js dev server
# with hot reload is friction-free run natively (`npm run dev` inside
# frontend/), and the deployed target is Vercel, not a container. See
# README.md for both local and deployed setups.
